<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="GaanBox: share your favourite songs along with the story behind them."/>
  <meta name="theme-color" content="#0b1220" />
  <title>GaanBox 🎵</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="hero">
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch theme" title="Switch theme"></button>
    <div class="hero-inner">
      <div class="logo" aria-hidden="true">🎶</div>
      <h1>GaanBox</h1>
      <p class="subtitle">Every song has a story. Share yours 💙</p>
    </div>
  </header>

  <main class="container" id="main">

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button type="button" class="tab active" id="tab-btn-mine" role="tab" aria-selected="true">My collection</button>
      <button type="button" class="tab" id="tab-btn-community" role="tab" aria-selected="false">🌍 Community</button>
    </nav>

    <section id="tab-mine">
    <form class="song-form" id="song-form" novalidate>
      <h2 id="form-title">Add a song</h2>
      <input type="text" id="song-name" placeholder="Song Name" maxlength="100" required />
      <input type="text" id="song-artist" placeholder="Artist Name" maxlength="100" required />
      <input type="url" id="song-link" placeholder="YouTube / Spotify link" required />
      <select id="song-mood" aria-label="Mood">
        <option value="">Mood (optional)</option>
        <option>😊 Happy</option>
        <option>😢 Sad</option>
        <option>🔥 Energetic</option>
        <option>🌙 Calm</option>
        <option>💘 Romantic</option>
        <option>🧠 Nostalgic</option>
      </select>
      <textarea id="song-story" rows="4" maxlength="600" placeholder="What's the story behind this song?" required></textarea>
      <div class="char-count"><span id="char-count">0</span>/600</div>
      <p class="form-error" id="form-error" role="alert"></p>
      <div class="form-buttons">
        <button type="submit" id="submit-btn">Add Song</button>
        <button type="button" id="cancel-edit" class="secondary" hidden>Cancel</button>
      </div>
    </form>

    <div class="toolbar">
      <input type="search" id="search" placeholder="🔍 Search songs, artists or stories" aria-label="Search" />
      <select id="sort" aria-label="Sort">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="name">Song A–Z</option>
        <option value="artist">Artist A–Z</option>
      </select>
      <button type="button" id="fav-filter" class="secondary small" aria-pressed="false">♥ Favorites</button>
    </div>

    <p class="count" id="count"></p>
    <div class="song-list" id="song-list"></div>

    <div class="footer-tools">
      <button type="button" id="export-btn" class="secondary small">⬇ Export</button>
      <label class="secondary small file-label">⬆ Import<input type="file" id="import-file" accept="application/json" hidden /></label>
    </div>
    </section>

    <section id="tab-community" hidden>
      <p class="hint">Songs shared by everyone using this GaanBox. Share one from your collection with the “Share” button.</p>
      <div class="toolbar">
        <input type="search" id="c-search" placeholder="🔍 Search the community" aria-label="Search community" />
        <select id="c-sort" aria-label="Sort community">
          <option value="newest">Newest first</option>
          <option value="popular">Most loved</option>
        </select>
      </div>
      <p class="count" id="c-status"></p>
      <div class="song-list" id="c-list"></div>
      <button type="button" id="c-more" class="secondary" hidden>Load more</button>
    </section>
  </main>

  <footer class="site-footer">Made with 💙 · GaanBox</footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
